[tools]
k3d = "latest"
k9s = "latest"
kubectl = "latest"
pre-commit = "latest"
python = "3.13"
ruff = "latest"
trivy = "latest"
uv = "latest"

[settings]
python.uv_venv_auto = true
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[env]
APP_REPO = 'Devops-Pipeline-Project'
GITOPS_REPO = 'Devops-Pipeline-Project-gitops'

[hooks]
enter = "bash ./scripts/setup_project"
