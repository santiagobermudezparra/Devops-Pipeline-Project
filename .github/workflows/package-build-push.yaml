name: Build and Push Packages

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    if: startsWith(github.event.release.tag_name, 'backend-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/study-app-api:${{ github.event.release.tag_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/study-app-api:latest

  build-frontend:
    if: startsWith(github.event.release.tag_name, 'frontend-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/study-app-web:${{ github.event.release.tag_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/study-app-web:latest
